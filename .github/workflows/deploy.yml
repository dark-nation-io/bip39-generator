name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js if missing
        run: |
          if ! command -v node &> /dev/null; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs
          fi
          node --version
          npm --version

      - name: Deploy to /opt/bip39
        run: |
          mkdir -p /opt/bip39
          cp bip39-generator.html server.js package.json /opt/bip39/
          cd /opt/bip39
          npm install --production

      - name: Restart server
        run: |
          pkill -f "node.*server.js" 2>/dev/null || true
          sleep 2
          cd /opt/bip39
          bash -c 'nohup node server.js > server.log 2>&1 & disown'
          sleep 3
          pgrep -fa "node.*server.js" && echo "Server started" || echo "FAILED TO START"

      - name: Ensure ngrok is running
        run: |
          if ! pgrep -f "ngrok http 8080" > /dev/null; then
            nohup ngrok http 8080 --log=stdout > /tmp/ngrok.log 2>&1 &
            sleep 3
            echo "ngrok started"
          fi
          curl -s http://127.0.0.1:4040/api/tunnels | python3 -c "import sys,json; print('Public URL:', json.load(sys.stdin)['tunnels'][0]['public_url'])" 2>/dev/null || echo "ngrok URL not ready yet"
