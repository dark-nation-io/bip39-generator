name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js if missing
        run: |
          if ! command -v node &> /dev/null; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs
          fi
          node --version
          npm --version

      - name: Deploy to /opt/bip39
        run: |
          mkdir -p /opt/bip39
          cp bip39-generator.html server.js package.json /opt/bip39/
          [ -f bloom_filter.bin ] && cp bloom_filter.bin /opt/bip39/
          [ -f build-bloom.js ] && cp build-bloom.js /opt/bip39/
          cd /opt/bip39
          npm install --production

      - name: Build funded address index if needed
        run: |
          cd /opt/bip39
          if [ ! -f funded_hash160.bin ] && [ -f /root/blockchair_btc_addresses.tsv.gz ]; then
            echo "Building funded_hash160.bin from blockchair dump..."
            node --max-old-space-size=512 build-bloom.js /root/blockchair_btc_addresses.tsv.gz
          elif [ -f funded_hash160.bin ]; then
            echo "funded_hash160.bin exists ($(du -h funded_hash160.bin | cut -f1))"
          else
            echo "No blockchair dump found at /root/blockchair_btc_addresses.tsv.gz — skipping"
          fi

      - name: Setup and restart server via systemd
        run: |
          cat > /etc/systemd/system/bip39.service <<'SVC'
          [Unit]
          Description=BIP39 Generator Server
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/bip39
          ExecStart=/usr/bin/node /opt/bip39/server.js
          Restart=on-failure
          RestartSec=5
          StandardOutput=append:/opt/bip39/server.log
          StandardError=append:/opt/bip39/server.log
          Environment=NODE_ENV=production

          [Install]
          WantedBy=multi-user.target
          SVC
          systemctl daemon-reload
          systemctl enable bip39.service
          systemctl restart bip39.service
          sleep 2
          systemctl is-active bip39.service && echo "Server started via systemd" || (echo "FAILED"; systemctl status bip39.service)

      - name: Setup nginx reverse proxy
        run: |
          if ! command -v nginx &> /dev/null; then
            apt-get update && apt-get install -y nginx
          fi

          cat > /etc/nginx/sites-available/wagerone <<'NGINX'
          server {
              listen 80;
              server_name wagerone-java-wrapper.bluestufftech.com 45.141.122.45;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
              }
          }
          NGINX

          ln -sf /etc/nginx/sites-available/wagerone /etc/nginx/sites-enabled/wagerone
          rm -f /etc/nginx/sites-enabled/default

          nginx -t && systemctl reload nginx
          echo "Nginx configured for wagerone.bluestufftech.com"

      - name: Setup SSL with Let's Encrypt
        run: |
          if ! command -v certbot &> /dev/null; then
            apt-get update && apt-get install -y certbot python3-certbot-nginx
          fi
          if [ ! -d /etc/letsencrypt/live/wagerone-java-wrapper.bluestufftech.com ]; then
            certbot --nginx -d wagerone-java-wrapper.bluestufftech.com --non-interactive --agree-tos -m claudedev2@negroup.com || echo "SSL setup failed — site works on HTTP, configure DNS and retry"
          else
            certbot renew --dry-run || true
          fi
