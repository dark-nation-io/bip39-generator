name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 51.77.117.66
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 20005
          source: "bip39-generator.html,server.js,package.json"
          target: "/opt/bip39"

      - name: Install deps and restart
        uses: appleboy/ssh-action@v1
        with:
          host: 51.77.117.66
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 20005
          script: |
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash - 2>/dev/null || true
            apt-get install -y nodejs 2>/dev/null || true

            cd /opt/bip39
            npm install --production

            pkill -f "node server.js" 2>/dev/null || true
            pkill -f "python3 -m http.server" 2>/dev/null || true
            sleep 1

            nohup node server.js > /opt/bip39/server.log 2>&1 &
            echo "Node server started on port 8080"

            if ! pgrep -f "ngrok http 8080" > /dev/null; then
              nohup ngrok http 8080 --log=stdout > /tmp/ngrok.log 2>&1 &
              sleep 3
              echo "ngrok started"
            fi

            curl -s http://127.0.0.1:4040/api/tunnels | python3 -c "import sys,json; print(json.load(sys.stdin)['tunnels'][0]['public_url'])" 2>/dev/null || echo "ngrok URL not ready yet"
